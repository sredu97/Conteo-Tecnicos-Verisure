<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoja de conteo de stock técnico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#E2001A">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">

<style>
  :root{
    --bg:#F4F4F6; --card:#FFFFFF; --card-2:#F6F6F8;
    --line:#DCDCE1; --line-soft:#EDEDF1;
    --text:#141418; --text-soft:#5D5D66; --text-faint:#8E8E97;
    --brand:#E2001A; --propio:#E2001A; --transito:#6B6B75; --defectuoso:#8A0010; --tipo:#2A2A30;
    --accent:var(--propio);
    --shadow:0 1px 0 rgba(20,20,24,.06);
    --radius:10px;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#141417; --card:#1E1E23; --card-2:#191920;
      --line:#33333B; --line-soft:#2A2A32;
      --text:#F2F2F4; --text-soft:#A9A9B2; --text-faint:#7C7C86;
      --brand:#FF4B5C; --propio:#FF4B5C; --transito:#ADADB8; --defectuoso:#FF8A8A; --tipo:#E6E6EA;
      --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141417; --card:#1E1E23; --card-2:#191920;
    --line:#33333B; --line-soft:#2A2A32;
    --text:#F2F2F4; --text-soft:#A9A9B2; --text-faint:#7C7C86;
    --brand:#FF4B5C; --propio:#FF4B5C; --transito:#ADADB8; --defectuoso:#FF8A8A; --tipo:#E6E6EA;
    --shadow:none;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 12px}

  /* ---------- identificación ---------- */
  .gate{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 12px}
  .gate-card{
    width:100%;max-width:420px;background:var(--card);
    border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:var(--radius);padding:22px 20px 20px;
  }
  .gate h1{color:var(--brand);
    font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;
    font-size:28px;line-height:1.1;margin:0 0 6px;
  }
  .gate p{margin:0 0 20px;color:var(--text-soft);font-size:14px}
  .field{margin-bottom:14px}
  .field label{
    display:block;font-size:13px;color:var(--text-soft);margin-bottom:5px;font-weight:500;
  }
  .field input{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
    background:var(--card-2);color:var(--text);font-family:inherit;font-size:16px;
  }
  .field input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .hint{font-size:12px;color:var(--text-faint);margin-top:5px}
  .gate .btn{width:100%;margin-top:8px;padding:12px}
  .err{color:var(--defectuoso);font-size:13px;min-height:18px;margin-top:8px}

  /* ---------- cabecera ---------- */
  header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
  .head-top{display:flex;align-items:baseline;gap:10px;padding:14px 0 10px}
  .head-top h1{color:var(--brand);
    font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;
    font-size:26px;letter-spacing:.01em;margin:0;
  }
  .tec{
    font-family:"Barlow Semi Condensed",sans-serif;font-size:15px;color:var(--text-soft);
    font-weight:500;font-variant-numeric:tabular-nums;background:none;border:none;
    cursor:pointer;padding:0;text-align:left;
  }
  .tec:hover{color:var(--text)}
  .theme-btn{
    margin-left:auto;background:none;border:1px solid var(--line);color:var(--text-soft);
    border-radius:999px;width:32px;height:32px;font-size:14px;cursor:pointer;line-height:1;
  }

  .segmented{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
  .segmented::-webkit-scrollbar{display:none}
  .seg{
    flex:1 0 auto;min-width:84px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:7px 10px 8px;cursor:pointer;text-align:left;
    color:var(--text-soft);font-family:Inter,sans-serif;font-size:12px;font-weight:500;
    display:flex;flex-direction:column;gap:1px;
  }
  .seg b{
    font-family:"Barlow Semi Condensed",sans-serif;font-size:19px;font-weight:700;
    color:var(--text);font-variant-numeric:tabular-nums;line-height:1;
  }
  .seg[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 3px 0 0 var(--c);color:var(--c)}
  .seg[aria-pressed="true"] b{color:var(--c)}

  .tools{display:flex;gap:8px;padding-bottom:10px}
  .search{position:relative;flex:1}
  .search input{
    width:100%;padding:10px 32px 10px 12px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--card);color:var(--text);
    font-family:inherit;font-size:15px;
  }
  .search input::placeholder{color:var(--text-faint)}
  .clear{
    position:absolute;right:4px;top:4px;width:28px;height:28px;border:none;background:none;
    color:var(--text-faint);font-size:16px;cursor:pointer;border-radius:6px;
  }
  .filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text-soft);
    border-radius:999px;padding:5px 12px;font-size:13px;font-family:inherit;cursor:pointer;
  }
  .chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

  /* ---------- lista ---------- */
  .count-line{
    display:flex;align-items:center;gap:8px;padding:12px 2px 8px;
    font-size:13px;color:var(--text-soft);font-variant-numeric:tabular-nums;
  }
  .count-line .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .progress{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden;max-width:160px}
  .progress i{display:block;height:100%;background:var(--accent);width:0}

  ul.list{list-style:none;margin:0;padding:0 0 88px;display:flex;flex-direction:column;gap:6px}
  li.row{
    background:var(--card);border:1px solid var(--line-soft);border-left:3px solid transparent;
    border-radius:var(--radius);box-shadow:var(--shadow);
    display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;
    padding:9px 10px 9px 11px;
  }
  li.row.has{border-left-color:var(--accent)}
  li.row.counted{border-left-color:var(--tipo);background:var(--card-2)}
  .info{min-width:0}
  .ref{
    font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:16px;
    letter-spacing:.03em;font-variant-numeric:tabular-nums;
  }
  .name{font-size:13px;color:var(--text-soft);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .others{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .pill{
    font-size:11px;font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;
    letter-spacing:.02em;border:1px solid var(--line);border-radius:999px;padding:1px 7px;
    color:var(--text-faint);font-variant-numeric:tabular-nums;background:none;cursor:pointer;
  }
  .pill.on{color:var(--pc);border-color:var(--pc)}

  .stepper{display:flex;align-items:center;gap:2px}
  .step{
    width:42px;height:42px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font-size:22px;
    font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;user-select:none;
  }
  .step:active{background:var(--accent);border-color:var(--accent);color:#fff}
  .step.minus{color:var(--text-soft)}
  .qty{
    width:56px;height:42px;text-align:center;border:none;background:none;color:var(--text);
    font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:24px;
    font-variant-numeric:tabular-nums;-moz-appearance:textfield;
  }
  .qty::-webkit-outer-spin-button,.qty::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .qty:focus{outline:2px solid var(--accent);outline-offset:1px;border-radius:6px}
  .qty.pending{color:var(--text-faint)}
  .undo{border:none;background:none;color:var(--text-faint);font-size:15px;width:24px;height:42px;cursor:pointer;padding:0}
  .undo[hidden]{display:none}

  .empty{padding:36px 8px;text-align:center;color:var(--text-soft)}
  .empty b{display:block;font-family:"Barlow Semi Condensed",sans-serif;font-size:19px;color:var(--text)}

  /* ---------- pie ---------- */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
    border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  }
  .bar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .stat{
    font-family:"Barlow Semi Condensed",sans-serif;font-variant-numeric:tabular-nums;
    font-size:13px;color:var(--text-soft);margin-right:auto;line-height:1.25;
  }
  .stat b{display:block;font-size:19px;color:var(--text);font-weight:700}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;
    padding:9px 13px;font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;
  }
  .btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn[hidden]{display:none}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:40;
    background:var(--text);color:var(--bg);padding:9px 15px;border-radius:999px;
    font-size:13.5px;opacity:0;pointer-events:none;
  }
  .toast.on{opacity:1}

  /* copia manual si el portapapeles falla */
  .sheet{
    position:fixed;inset:0;z-index:50;background:rgba(20,20,24,.55);
    display:flex;align-items:flex-end;justify-content:center;padding:12px;
  }
  .sheet[hidden]{display:none}
  .sheet-card{background:var(--card);border-radius:var(--radius);padding:14px;width:100%;max-width:620px}
  .sheet-card textarea{
    width:100%;height:46svh;border:1px solid var(--line);border-radius:9px;background:var(--card-2);
    color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;padding:10px;
  }
  .sheet-card .row-btns{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:no-preference){
    .step,.chip,.seg,.toast{transition:background-color .12s ease,color .12s ease,border-color .12s ease,opacity .18s ease}
  }
  @media (max-width:420px){
    .name{font-size:12.5px}
    .step{width:40px;height:40px}
    .qty{width:48px}
  }
</style>
</head>
<body>

<!-- ===== identificación ===== -->
<section class="gate" id="gate">
  <div class="gate-card">
    <h1>Hoja de conteo de stock</h1>
    <p>Todas las referencias empiezan a cero. Antes de contar, identifícate: tu nombre y matrícula van en la hoja y en el archivo que envíes.</p>
    <div class="field">
      <label for="nombre">Nombre y apellidos</label>
      <input id="nombre" type="text" autocomplete="name" placeholder="Nombre y apellidos">
    </div>
    <div class="field">
      <label for="matricula">Matrícula</label>
      <input id="matricula" type="text" inputmode="numeric" autocomplete="off" placeholder="Ej. 320273">
      <div class="hint">Tu número de técnico.</div>
    </div>
    <div class="err" id="gateErr"></div>
    <button class="btn primary" id="gateGo">Empezar el conteo</button>
  </div>
</section>

<!-- ===== app ===== -->
<div id="app" hidden>
<header>
  <div class="wrap">
    <div class="head-top">
      <h1>Conteo de stock</h1>
      <button class="tec" id="tec" title="Cambiar nombre o matrícula"></button>
      <button class="theme-btn" id="theme" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
    </div>
    <div class="segmented" id="segmented" role="group" aria-label="Tipo de cantidad"></div>
    <div class="tools">
      <div class="search">
        <input id="q" type="search" placeholder="Buscar referencia o descripción" autocomplete="off" aria-label="Buscar">
        <button class="clear" id="clear" aria-label="Borrar búsqueda" hidden>✕</button>
      </div>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Filtros"></div>
  </div>
</header>

<main class="wrap">
  <div class="count-line">
    <span class="dot"></span><span id="countline"></span>
    <span class="progress"><i id="progress"></i></span>
  </div>
  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" hidden><b>Sin resultados</b>Prueba con otra referencia o cambia el filtro.</div>
</main>

<div class="bar">
  <div class="wrap">
    <div class="stat"><b id="statTotal">0</b><span id="statSub">unidades</span></div>
    <button class="btn" id="wipe">Vaciar</button>
    <button class="btn" id="copy">Copiar resumen</button>
    <button class="btn primary" id="csv" hidden>Guardar CSV</button>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <textarea id="sheetText" readonly aria-label="Resumen del conteo"></textarea>
    <div class="row-btns">
      <button class="btn" id="sheetClose">Cerrar</button>
    </div>
  </div>
</div>

<script>
/* ===== referencias (todas a cero) ===== */
const BASE = [
["AJ002SP","Antijamming Sentinel ES sin pila"],

["340001V","Detector Inhibición 3 DDI Sentinel"],

["7002","Pila litio 3V CR123A"],
["7002K","Pila litio CR123A 3V"],
["7006","Pila alcalina LRS20-2 1,5 V"],
["7008","Pila litio 3V botón CR2450"],
["7011","Pack 3 pilas litio CR123A"],
["7014","Pila alcalina LR6 1,5 V high quality"],
["9010","Batería 12V-7,2AH"],
["9085","Tarjeta SIM Movistar Global SP"],
["9088","Tarjeta SIM Orange unificada"],
["9107","Tarjeta SIM Vodafone Verifast"],
["9114","Tarjeta SIM Vodafone VF4 4G"],
["9115","Tarjeta SIM Orange VF4 4G"]
];

const TYPES = [
  {key:"p", label:"Propio",     color:"var(--propio)"},
  {key:"t", label:"Tránsito",   color:"var(--transito)"},
  {key:"d", label:"Defectuoso", color:"var(--defectuoso)"},
  {key:"s", label:"Stock type", color:"var(--tipo)"}
];
const KEYS = TYPES.map(t=>t.key);

const items = BASE.map(r=>({ref:r[0], name:r[1], cnt:{p:0,t:0,d:0,s:0}}));
const byRef = new Map(items.map(i=>[i.ref,i]));
const touched = new Set();
const isTouched = (ref,k)=>touched.has(ref+"|"+k);

let activeType = "p";
let filter = "todos";
let query = "";
let tech = {nombre:"", matricula:"", inicio:null};

const LS = "hoja-conteo-stock";

/* ---------- guardado local ---------- */
function save(){
  const v = {};
  for(const it of items){
    const d = {};
    for(const k of KEYS) if(it.cnt[k] !== 0) d[k] = it.cnt[k];
    if(Object.keys(d).length) v[it.ref] = d;
  }
  try{
    localStorage.setItem(LS, JSON.stringify({tech, values:v, touched:[...touched], updatedAt:Date.now()}));
  }catch(e){}
}
function load(){
  let data = null;
  try{ data = JSON.parse(localStorage.getItem(LS) || "null"); }catch(e){}
  if(!data) return false;
  if(data.tech && data.tech.nombre && data.tech.matricula) tech = data.tech;
  if(Array.isArray(data.touched)) data.touched.forEach(x=>touched.add(x));
  if(data.values && typeof data.values === "object"){
    for(const [ref,v] of Object.entries(data.values)){
      const it = byRef.get(ref);
      if(!it || !v) continue;
      for(const k of KEYS){
        const n = Number(v[k]);
        if(Number.isFinite(n)) it.cnt[k] = Math.round(n);
      }
    }
  }
  return !!(tech.nombre && tech.matricula);
}

/* ---------- identificación ---------- */
const gate = document.getElementById("gate");
const app = document.getElementById("app");
const nombreIn = document.getElementById("nombre");
const matriculaIn = document.getElementById("matricula");

function openGate(){
  nombreIn.value = tech.nombre || "";
  matriculaIn.value = tech.matricula || "";
  document.getElementById("gateErr").textContent = "";
  gate.hidden = false;
  app.hidden = true;
  setTimeout(()=>nombreIn.focus(), 60);
}
function closeGate(){
  gate.hidden = true;
  app.hidden = false;
  render();
}
document.getElementById("gateGo").addEventListener("click", ()=>{
  const n = nombreIn.value.trim();
  const m = matriculaIn.value.trim();
  const err = document.getElementById("gateErr");
  if(n.length < 3){ err.textContent = "Escribe tu nombre y apellidos."; nombreIn.focus(); return; }
  if(m.length < 3){ err.textContent = "Escribe tu matrícula de técnico."; matriculaIn.focus(); return; }
  tech = {nombre:n, matricula:m, inicio: tech.inicio || Date.now()};
  save();
  closeGate();
});
[nombreIn, matriculaIn].forEach(el=>{
  el.addEventListener("keydown", e=>{ if(e.key==="Enter") document.getElementById("gateGo").click(); });
});
document.getElementById("tec").addEventListener("click", openGate);

/* ---------- interacción ---------- */
function change(ref, key, delta){
  const it = byRef.get(ref);
  if(!it) return;
  it.cnt[key] += delta;
  touched.add(ref+"|"+key);
  save(); render();
}
function setValue(ref, key, value){
  const it = byRef.get(ref);
  if(!it) return;
  const n = Math.round(Number(value));
  if(!Number.isFinite(n)){ render(); return; }
  it.cnt[key] = n;
  touched.add(ref+"|"+key);
  save(); render();
}
function undoRow(ref){
  const it = byRef.get(ref);
  for(const k of KEYS){ it.cnt[k] = 0; touched.delete(ref+"|"+k); }
  save(); render();
}

/* ---------- pintado ---------- */
const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");

function visible(){
  const q = query.trim().toLowerCase();
  return items.filter(it=>{
    if(q && !(it.ref.toLowerCase().includes(q) || it.name.toLowerCase().includes(q))) return false;
    if(filter==="contadas" && !isTouched(it.ref, activeType)) return false;
    if(filter==="pendientes" && isTouched(it.ref, activeType)) return false;
    if(filter==="unidades" && it.cnt[activeType] === 0) return false;
    return true;
  });
}

function render(){
  const t = TYPES.find(x=>x.key===activeType);
  document.documentElement.style.setProperty("--accent", t.color);
  document.getElementById("tec").textContent = `${tech.nombre} · ${tech.matricula}`;

  const seg = document.getElementById("segmented");
  seg.innerHTML = "";
  for(const ty of TYPES){
    const total = items.reduce((a,i)=>a+i.cnt[ty.key],0);
    const b = document.createElement("button");
    b.className = "seg";
    b.style.setProperty("--c", ty.color);
    b.setAttribute("aria-pressed", String(ty.key===activeType));
    b.innerHTML = "<b></b><span></span>";
    b.querySelector("b").textContent = total;
    b.querySelector("span").textContent = ty.label;
    b.addEventListener("click", ()=>{ activeType = ty.key; render(); });
    seg.appendChild(b);
  }

  const fl = document.getElementById("filters");
  if(!fl.dataset.built){
    for(const [k,label] of [["todos","Todas"],["pendientes","Sin contar"],["contadas","Contadas"],["unidades","Con unidades"]]){
      const c = document.createElement("button");
      c.className = "chip"; c.textContent = label; c.dataset.k = k;
      c.addEventListener("click", ()=>{ filter = (filter===k && k!=="todos") ? "todos" : k; render(); });
      fl.appendChild(c);
    }
    fl.dataset.built = "1";
  }
  fl.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", String(c.dataset.k===filter)));

  const rows = visible();
  listEl.innerHTML = "";
  emptyEl.hidden = rows.length > 0;

  for(const it of rows){
    const li = document.createElement("li");
    li.className = "row";
    const val = it.cnt[activeType];
    const done = isTouched(it.ref, activeType);
    if(val !== 0) li.classList.add("has");
    if(done) li.classList.add("counted");

    const info = document.createElement("div"); info.className = "info";
    const ref = document.createElement("div"); ref.className = "ref"; ref.textContent = it.ref;
    const name = document.createElement("div"); name.className = "name"; name.textContent = it.name; name.title = it.name;
    const others = document.createElement("div"); others.className = "others";

    for(const ty of TYPES){
      if(ty.key === activeType) continue;
      const p = document.createElement("button");
      p.className = "pill" + (it.cnt[ty.key] !== 0 ? " on" : "");
      p.style.setProperty("--pc", ty.color);
      p.textContent = `${ty.label} ${it.cnt[ty.key]}`;
      p.title = `Contar ${ty.label.toLowerCase()}`;
      p.addEventListener("click", ()=>{ activeType = ty.key; render(); });
      others.appendChild(p);
    }
    info.append(ref, name, others);

    const st = document.createElement("div"); st.className = "stepper";
    const undo = document.createElement("button");
    undo.className = "undo"; undo.textContent = "⟲";
    undo.title = "Dejar sin contar";
    undo.setAttribute("aria-label", `Dejar ${it.ref} sin contar`);
    undo.hidden = !KEYS.some(k=>isTouched(it.ref,k));
    undo.addEventListener("click", ()=>undoRow(it.ref));

    const minus = document.createElement("button");
    minus.className = "step minus"; minus.textContent = "−";
    minus.setAttribute("aria-label", `Quitar una unidad de ${it.ref}`);
    minus.addEventListener("click", ()=>change(it.ref, activeType, -1));

    const qty = document.createElement("input");
    qty.className = "qty" + (done ? "" : " pending");
    qty.type = "number"; qty.inputMode = "numeric"; qty.value = String(val);
    qty.setAttribute("aria-label", `Unidades de ${it.ref}`);
    qty.addEventListener("focus", ()=>qty.select());
    qty.addEventListener("change", ()=>setValue(it.ref, activeType, qty.value));
    qty.addEventListener("keydown", e=>{ if(e.key==="Enter") qty.blur(); });

    const plus = document.createElement("button");
    plus.className = "step"; plus.textContent = "+";
    plus.setAttribute("aria-label", `Añadir una unidad a ${it.ref}`);
    plus.addEventListener("click", ()=>change(it.ref, activeType, 1));

    st.append(undo, minus, qty, plus);
    li.append(info, st);
    listEl.appendChild(li);
  }

  const contadas = items.filter(i=>isTouched(i.ref, activeType)).length;
  const total = items.reduce((a,i)=>a+i.cnt[activeType],0);
  document.getElementById("countline").textContent =
    `${rows.length} de ${items.length} referencias · contando ${t.label.toLowerCase()}`;
  document.getElementById("progress").style.width = (contadas/items.length*100).toFixed(1)+"%";
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSub").textContent =
    `unidades en ${t.label.toLowerCase()} · ${contadas}/${items.length} refs contadas`;
}

/* ---------- salida ---------- */
function resumenTexto(){
  const fecha = new Date().toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const lineas = [`Conteo de stock — ${tech.nombre} (${tech.matricula})`, fecha, ""];
  let n = 0;
  for(const it of items){
    if(KEYS.every(k=>it.cnt[k]===0)) continue;
    n++;
    const partes = TYPES.filter(ty=>it.cnt[ty.key]!==0).map(ty=>`${ty.label} ${it.cnt[ty.key]}`);
    lineas.push(`${it.ref} · ${it.name} — ${partes.join(" · ")}`);
  }
  if(n === 0) lineas.push("Sin unidades contadas.");
  const contadas = items.filter(i=>KEYS.some(k=>isTouched(i.ref,k))).length;
  lineas.push("", `${n} referencias con unidades · ${contadas} de ${items.length} revisadas`);
  return lineas.join("\n");
}
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("on"), 1900);
}
document.getElementById("copy").addEventListener("click", async ()=>{
  const txt = resumenTexto();
  try{
    await navigator.clipboard.writeText(txt);
    toast("Resumen copiado");
  }catch(e){
    document.getElementById("sheetText").value = txt;
    document.getElementById("sheet").hidden = false;
    document.getElementById("sheetText").select();
  }
});
document.getElementById("sheetClose").addEventListener("click", ()=>{ document.getElementById("sheet").hidden = true; });

document.getElementById("wipe").addEventListener("click", ()=>{
  const contadas = items.filter(i=>KEYS.some(k=>isTouched(i.ref,k))).length;
  if(contadas === 0){ toast("Ya está todo a cero"); return; }
  if(!confirm(`Se pondrán a cero las ${contadas} referencias contadas. ¿Vaciar la hoja?`)) return;
  for(const it of items) for(const k of KEYS) it.cnt[k] = 0;
  touched.clear();
  save(); render();
});

const qInput = document.getElementById("q");
qInput.addEventListener("input", ()=>{
  query = qInput.value;
  document.getElementById("clear").hidden = !query;
  render();
});
document.getElementById("clear").addEventListener("click", ()=>{
  qInput.value=""; query=""; document.getElementById("clear").hidden = true; qInput.focus(); render();
});

const themeBtn = document.getElementById("theme");
themeBtn.addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(LS+"-theme", next); }catch(e){}
});
try{
  const th = localStorage.getItem(LS+"-theme");
  if(th) document.documentElement.setAttribute("data-theme", th);
}catch(e){}

/* ---------- arranque ---------- */
const ready = load();
if(ready) closeGate(); else openGate();


/* descarga de ficheros en navegador (GitHub Pages) */
function saveFile(filename, text){
  try{
    const blob = new Blob(["\uFEFF"+text], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 800);
    return true;
  }catch(e){ return false; }
}

(function(){
  const btn = document.getElementById("csv");
  btn.hidden = false;
  btn.addEventListener("click", ()=>{
    const head = `Nombre;${tech.nombre}\nMatricula;${tech.matricula}\nFecha;${new Date().toLocaleString("es-ES")}\n\nReferencia;Descripcion;Propio;Transito;Defectuoso;Stock type;Contada\n`;
    const body = items.map(i=>[
      i.ref, '"'+i.name.replace(/"/g,'""')+'"',
      i.cnt.p, i.cnt.t, i.cnt.d, i.cnt.s,
      KEYS.some(k=>isTouched(i.ref,k)) ? "Si" : "No"
    ].join(";")).join("\n");
    const stamp = new Date().toISOString().slice(0,10);
    if(saveFile(`conteo-${tech.matricula}-${stamp}.csv`, head+body)) toast("CSV descargado");
  });
})();

/* funcionamiento sin cobertura */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
